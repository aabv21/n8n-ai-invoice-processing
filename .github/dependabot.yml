version: 2
updates:
  # npm ecosystem also reads the pnpm lockfile.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # NOTE: @types/node follows the Node LTS major (24); a newer major types APIs this Node
      # lacks. Move it by hand with the next Node LTS major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # NOTE: typescript 7 is the native port with no classic compiler API, and typescript-eslint
      # 8.x needs typescript below 6.1. Move both by hand once typescript-eslint supports 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # CodeQL fails when its init and analyze steps run different versions, so they move together.
      codeql-action:
        patterns:
          - 'github/codeql-action*'

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # NOTE: n8n tags beta and stable releases with the same plain semver (no -beta suffix), so
      # Dependabot can't tell them apart. Minor and major bumps are reviewed and pinned by hand.
      - dependency-name: n8nio/n8n
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # NOTE: a Postgres major can't start on the previous major's data directory without
      # pg_upgrade, so a major bump would break every local volume. Plan one by hand with a
      # dump and restore.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
